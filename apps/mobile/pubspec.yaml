name: memoria
description: "Memoria — print-first photo book app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  google_mlkit_face_detection: ^0.15.1
  google_mlkit_image_labeling: ^0.16.1
  image: ^4.10.1
  supabase_flutter: ^2.17.2
  flutter_stripe: ^14.1.0
  purchases_flutter: ^10.13.2
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  sentry_flutter: 9.30.1
  posthog_flutter: ^5.50.0
  path: ^1.9.1
  qr_flutter: ^4.1.0
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.4.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/geo/
    - assets/spec/
    - assets/samples/wedding/
    - assets/samples/travel/
    - assets/music/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-400.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-500.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-600.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-700.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic-500.ttf
          weight: 500
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
          weight: 400
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
        - asset: assets/fonts/Lora-Italic-400.ttf
          weight: 400
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-400.ttf
          weight: 400

# Regenerate with: dart run flutter_launcher_icons && dart run flutter_native_splash:create
# Source images come from tools/brand/make_icons.py.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#B04E2B"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"

flutter_native_splash:
  color: "#F7F3EC"
  image: "assets/brand/splash_mark.png"
  color_dark: "#15130F"
  image_dark: "assets/brand/splash_mark_dark.png"
  android_12:
    color: "#F7F3EC"
    image: "assets/brand/splash_mark.png"
    color_dark: "#15130F"
    image_dark: "assets/brand/splash_mark_dark.png"
  ios: true
  android: true
  web: false
